<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Fieldnote workflow illustration</title><desc id="desc">A structured playtest plan, observation timeline and local export flow.</desc><rect width="1200" height="675" rx="36" fill="#f2eee8"/><rect x="56" y="54" width="1088" height="567" rx="28" fill="#152b2a"/><text x="104" y="120" fill="#8df0c8" font-family="Arial,sans-serif" font-size="22" font-weight="700">FIELDNOTE / PLAYTEST RESEARCH</text><text x="104" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="47" font-weight="700">From a playtest to reviewable evidence.</text><rect x="104" y="242" width="310" height="278" rx="18" fill="#203d3a"/><text x="132" y="286" fill="#8df0c8" font-family="Arial,sans-serif" font-size="18" font-weight="700">PLAN</text><text x="132" y="333" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">Find the first point</text><text x="132" y="368" fill="#fff" font-family="Arial,sans-serif" font-size="26" font-weight="700">of confusion</text><g fill="#8df0c8"><circle cx="143" cy="421" r="7"/><circle cx="143" cy="459" r="7"/></g><g fill="#d9e9e4" font-family="Arial,sans-serif" font-size="18"><text x="165" y="428">Task 01  Start a run</text><text x="165" y="466">Task 02  Review result</text></g><path d="M446 382h118" stroke="#8df0c8" stroke-width="4" stroke-linecap="round"/><path d="m548 365 18 17-18 17" fill="none" stroke="#8df0c8" stroke-width="4"/><rect x="596" y="242" width="244" height="278" rx="18" fill="#fff"/><text x="624" y="286" fill="#152b2a" font-family="Arial,sans-serif" font-size="18" font-weight="700">REVIEW</text><path d="M632 340h170M632 392h132M632 444h154" stroke="#b9cdc7" stroke-width="14" stroke-linecap="round"/><circle cx="666" cy="340" r="18" fill="#ff8e73"/><circle cx="724" cy="392" r="18" fill="#f4c95d"/><circle cx="780" cy="444" r="18" fill="#8df0c8"/><path d="M872 382h84" stroke="#8df0c8" stroke-width="4" stroke-linecap="round"/><path d="m940 365 18 17-18 17" fill="none" stroke="#8df0c8" stroke-width="4"/><rect x="988" y="242" width="116" height="278" rx="18" fill="#8df0c8"/><text transform="translate(1032 486) rotate(-90)" fill="#152b2a" font-family="Arial,sans-serif" font-size="21" font-weight="700">LOCAL EXPORT</text><text x="104" y="573" fill="#d9e9e4" font-family="Arial,sans-serif" font-size="18">Plan  /  Run  /  Review  /  Compare  /  Export</text></svg>
