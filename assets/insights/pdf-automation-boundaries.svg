<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">PDF automation boundary map</title>
  <desc id="desc">A workflow from input through validation and processing to output, surrounded by security and retention boundaries.</desc>
  <rect width="1200" height="630" fill="#0a0a0c"/>
  <rect x="55" y="55" width="1090" height="520" rx="30" fill="#131316" stroke="#fcd34d" stroke-width="3"/>
  <text x="95" y="115" fill="#fcd34d" font-family="Arial, sans-serif" font-size="24">Define the contract before choosing the PDF operation</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#18181c" stroke="#3f3f46" stroke-width="2">
      <rect x="100" y="225" width="200" height="115" rx="16"/><rect x="365" y="225" width="200" height="115" rx="16"/>
      <rect x="630" y="225" width="200" height="115" rx="16"/><rect x="895" y="225" width="200" height="115" rx="16"/>
    </g>
    <g fill="#fff" font-size="24"><text x="200" y="275">Input</text><text x="465" y="275">Validate</text><text x="730" y="275">Process</text><text x="995" y="275">Output</text></g>
    <g fill="#a1a1aa" font-size="17"><text x="200" y="310">URL · upload · base64</text><text x="465" y="310">size · type · network</text><text x="730" y="310">pages · quality · limits</text><text x="995" y="310">status · file · expiry</text></g>
  </g>
  <g stroke="#fcd34d" stroke-width="3" fill="none"><path d="M300 282h65"/><path d="M565 282h65"/><path d="M830 282h65"/></g>
  <g fill="#fcd34d"><path d="m355 273 15 9-15 9z"/><path d="m620 273 15 9-15 9z"/><path d="m885 273 15 9-15 9z"/></g>
  <path d="M120 425h960" stroke="#8542f0" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="600" y="470" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="21" text-anchor="middle">Security · observability · retention · stable failure codes</text>
</svg>
